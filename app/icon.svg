<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#080914" />
      <stop offset="100%" stopColor="#0e0c1f" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="vdBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#ec4899" />
    </linearGradient>

    <!-- Vibrant Kinetic Bolt Gradient -->
    <linearGradient id="vdBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="40%" stopColor="#06b6d4" />
      <stop offset="70%" stopColor="#8b5cf6" />
      <stop offset="100%" stopColor="#f43f5e" />
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#06b6d4" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Neo-Obsidian Squircle Container -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#vdBg)" stroke="url(#vdBorder)" stroke-width="1.5" />

  <!-- Ambient Glow Core -->
  <circle cx="16" cy="16" r="7" fill="#818cf8" opacity="0.25" filter="url(#boltGlow)" />

  <!-- High-Contrast Kinetic Vibe Bolt (VibeDocker Emblem) -->
  <path
    d="M18 4L8 16H15L13 28L24 14H16.5L18 4Z"
    fill="url(#vdBolt)"
    stroke="#ffffff"
    stroke-width="0.8"
    stroke-linejoin="round"
    filter="url(#boltGlow)"
  />

  <!-- Crisp Core Accent -->
  <path
    d="M17.5 7L10.5 15.5H15.5L14 24.5L21.5 14.5H16.5L17.5 7Z"
    fill="#ffffff"
    opacity="0.4"
  />
</svg>
